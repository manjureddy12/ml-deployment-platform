# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqi-prediction-deployment
  labels:
    app: aqi-prediction-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aqi-prediction-api
  template:
    metadata:
      labels:
        app: aqi-prediction-api
    spec:
      containers:
        - name: aqi-prediction-api
          image: manjunadhreddy/aqi-prediction-api:v1
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 10
